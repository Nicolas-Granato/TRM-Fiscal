name: CI - TRM Fiscal

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-tests:
    name: Back-end (Python / Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/requirements.txt"

      - name: Instalar dependências do sistema (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libpangoft2-1.0-0 \
            libharfbuzz0b \
            libffi-dev \
            shared-mime-info

      - name: Instalar dependências Python
        run: |
          if [ -f "backend/requirements.txt" ]; then
            uv pip install --system -r backend/requirements.txt
          elif [ -f "requirements.txt" ]; then
            uv pip install --system -r requirements.txt
          fi
          uv pip install --system pytest pytest-cov

      - name: Executar testes automatizados (Pytest)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest backend/tests -v --cov=backend/src --cov-report=term-missing

  frontend-build:
    name: Front-end (React / TypeScript / Vite)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipagem TypeScript e gerar build
        run: npm run build

  docker-validation:
    name: Validar Build das Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Testar build do Docker Compose
        run: docker compose build
